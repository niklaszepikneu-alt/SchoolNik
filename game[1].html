<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jump Rush: YouTuber Hunt</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #game{width:100vw;height:100vh}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 4px #000}
  .pill{position:absolute;top:14px;padding:10px 14px;border-radius:14px;background:#12233dcc;border:1px solid #ffffff25;backdrop-filter:blur(5px)}
  #money{left:14px}.dist{left:50%;transform:translateX(-50%)}#upgrade{right:14px}
  #help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:12px;background:#12233dcc;font-size:13px}
  #toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:18px;opacity:0;transition:.2s}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;color:white;text-align:center}
  #panel{background:#10243b;border:1px solid #ffffff25;border-radius:24px;padding:28px;max-width:430px;box-shadow:0 20px 80px #0009}
  button{border:0;border-radius:12px;padding:12px 18px;background:#32d583;color:#07111f;font-weight:900;cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="pill" id="money">🪙 0</div>
  <div class="pill dist" id="distance">0 m</div>
  <div class="pill" id="upgrade">⚡ Speed 1 · ⬆️ Jump 1</div>
  <div id="toast"></div>
  <div id="help">← → bewegen · SPACE springen · B Base · U Upgrade</div>
</div>
<div id="overlay"><div id="panel"><h1 id="endTitle">Run beendet</h1><p id="endText"></p><button id="restart">Nochmal spielen</button></div></div>
<script>
const state={money:0,gems:0,speed:1,jump:1,distance:0,carrying:null,baseCharacters:0,runCoins:0};
const rarities=[
  {name:"Common",color:0x8ca0b8,value:1,weight:55},
  {name:"Rare",color:0x4da6ff,value:5,weight:28},
  {name:"Epic",color:0xb36bff,value:20,weight:12},
  {name:"Legendary",color:0xffc83d,value:100,weight:5}
];
function pickRarity(){let n=Math.random()*100,s=0;for(const r of rarities){s+=r.weight;if(n<s)return r}return rarities[0]}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.opacity=1;clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.opacity=0,1200)}
function updateHUD(){money.textContent="🪙 "+Math.floor(state.money);distance.textContent=Math.floor(state.distance)+" m";upgrade.textContent=`⚡ Speed ${state.speed} · ⬆️ Jump ${state.jump}`}

class Main extends Phaser.Scene{
 constructor(){super("main")}
 create(){
  this.cameras.main.setBackgroundColor("#081827");
  this.physics.world.setBounds(0,-500,50000,1300);
  this.add.rectangle(25000,720,50000,300,0x173a31);
  this.add.rectangle(25000,860,50000,120,0x10261f);
  for(let x=0;x<50000;x+=240){this.add.rectangle(x,710,150,12,0x2a634d)}
  this.player=this.add.rectangle(170,620,38,58,0x7dd3fc);
  this.physics.add.existing(this.player);this.player.body.setGravityY(1500);this.player.body.setCollideWorldBounds(true);
  this.ground=this.add.rectangle(25000,680,50000,40,0x234b3a);this.physics.add.existing(this.ground,true);
  this.physics.add.collider(this.player,this.ground);
  this.cameras.main.startFollow(this.player,true,.08,.08);this.cameras.main.setFollowOffset(-180,80);
  this.keys=this.input.keyboard.addKeys("LEFT,RIGHT,SPACE,A,D,U,B");
  this.spawnWorld();
  this.last=0; this.coinTimer=0;
 }
 spawnWorld(){
  for(let x=500;x<15000;x+=Phaser.Math.Between(240,420)){
   const h=Phaser.Math.Between(40,180), w=Phaser.Math.Between(40,90);
   const block=this.add.rectangle(x,660-h/2,w,h,0x7f8c8d);this.physics.add.existing(block,true);
   this.physics.add.collider(this.player,block,()=>this.fail("Du bist an einem Hindernis hängen geblieben!"));
   if(Math.random()<.58){
    const r=pickRarity(), orb=this.add.circle(x+Phaser.Math.Between(-25,25),610-h,r.name==="Legendary"?17:13,r.color);
    orb.rarity=r;this.physics.add.existing(orb);orb.body.setAllowGravity(false);
    this.physics.add.overlap(this.player,orb,()=>this.collect(orb),null,this);
   }
   if(Math.random()<.22){
    const gap=this.add.rectangle(x+100,760,100,160,0x07111f);gap.isGap=true;
    // visual only; gaps are handled by a hidden floor section below
   }
  }
 }
 collect(orb){
  if(!orb.active||state.carrying)return;
  state.carrying=orb.rarity;orb.destroy();toast(`⭐ ${state.carrying.name} gesammelt! +${state.carrying.value}/s`);
 }
 fail(msg){
  if(this.over)return;this.over=true;this.physics.pause();
  document.getElementById("endTitle").textContent="Run beendet";
  document.getElementById("endText").textContent=msg+" Du hattest "+Math.floor(state.distance)+" m erreicht.";
  document.getElementById("overlay").style.display="flex";
 }
 update(t,dt){
  if(this.over)return;
  const k=this.keys;
  if(k.LEFT.isDown||k.A.isDown)this.player.body.setVelocityX(-180-state.speed*25);
  else if(k.RIGHT.isDown||k.D.isDown)this.player.body.setVelocityX(250+state.speed*35);
  else this.player.body.setVelocityX(160+state.speed*20);
  if(Phaser.Input.Keyboard.JustDown(k.SPACE)&&this.player.body.blocked.down)this.player.body.setVelocityY(-(480+state.jump*70));
  if(Phaser.Input.Keyboard.JustDown(k.U)&&state.money>=100){state.money-=100;state.speed++;state.jump++;toast("⬆️ Speed & Jump verbessert!")}
  if(Phaser.Input.Keyboard.JustDown(k.B)&&state.carrying){state.money+=state.carrying.value*25;state.baseCharacters++;toast(`🏠 ${state.carrying.name} in die Base gebracht!`);state.carrying=null}
  state.distance=Math.max(state.distance,(this.player.x-170)/10);
  this.coinTimer+=dt;
  if(this.coinTimer>1000){this.coinTimer-=1000;if(state.carrying){state.money+=state.carrying.value;state.runCoins+=state.carrying.value}updateHUD()}
  if(this.player.y>800)this.fail("Du bist gefallen!");
  updateHUD();
 }
}
new Phaser.Game({type:Phaser.AUTO,parent:"game",width:1280,height:720,physics:{default:"arcade",arcade:{gravity:{y:0},debug:false}},scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Main]});
restart.onclick=()=>location.reload();
updateHUD();
</script>
</body>
</html>
